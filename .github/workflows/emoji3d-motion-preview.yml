name: Build FUTO lossless 3D RGBA animated emoji preview APK

on:
  pull_request:
    paths:
      - "java/**"
      - "offline-ai-runtime/**"
      - "scripts/build_emoji3d_motion.py"
      - "scripts/build_emoji3d_assets.py"
      - "tests/unit/**"
      - ".github/workflows/emoji3d-motion-preview.yml"
  workflow_dispatch:
    inputs:
      lite:
        description: "Build core APK without ANY Fluent media plus all-four-catalog offline ZIP"
        type: boolean
        default: true

permissions:
  contents: read

# Keep image asset generation independent: generated caches are durable even
# when a newer commit supersedes an old APK build. Only APK jobs are cancelled.
jobs:
  static-assets:
    name: Produce/cache 256px lossless RGBA static artwork
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.lite) || (github.event_name == 'pull_request' && github.head_ref == 'feature/fluent3d-optional-hq-pack-lite-apk' && contains(github.event.pull_request.title, '[ci-final]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        id: static-cache
        with:
          path: |
            java/assets/emoji3d
            java/assets/emoji3d-share
          key: fluent3d-static128-share256-lossless-v3-7a40f1a2d064d76e436813edc0f09b6c8cde5da8-${{ hashFiles('scripts/build_emoji3d_assets.py') }}

      - name: Fetch and package all static artwork only on a cache miss
        if: steps.static-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          STATIC_SHA=7a40f1a2d064d76e436813edc0f09b6c8cde5da8
          STATIC_DIR="$RUNNER_TEMP/fluentui-emoji-unicode"
          mkdir -p "$STATIC_DIR"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 900 \
            "https://codeload.github.com/shuding/fluentui-emoji-unicode/tar.gz/$STATIC_SHA" \
            -o "$RUNNER_TEMP/fluent-static.tar.gz"
          tar xzf "$RUNNER_TEMP/fluent-static.tar.gz" -C "$STATIC_DIR" \
            --strip-components=1
          python -u scripts/build_emoji3d_assets.py \
            --source "$STATIC_DIR/assets" --dest java/assets/emoji3d \
            --share-dest java/assets/emoji3d-share --commit "$STATIC_SHA" \
            --jobs 4

      - name: Validate complete static catalogs before caching
        shell: bash
        run: |
          set -euo pipefail
          test -s java/assets/emoji3d/LICENSE.txt
          test -s java/assets/emoji3d-share/LICENSE.txt
          ui_count="$(wc -l < java/assets/emoji3d/index.txt)"
          share_count="$(wc -l < java/assets/emoji3d-share/index.txt)"
          test "$ui_count" -ge 2500
          test "$ui_count" -eq "$share_count"
          diff -q java/assets/emoji3d/index.txt \
            java/assets/emoji3d-share/index.txt
          test -s java/assets/emoji3d-share/1f600.webp
          test -s java/assets/emoji3d-share/1f44d-1f3fb.webp
          echo "Verified $share_count high-fidelity lossless RGBA masters"
          du -h -s java/assets/emoji3d java/assets/emoji3d-share

  motion-assets:
    name: Produce/cache 30 genuine 256px lossless animations
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.lite) || (github.event_name == 'pull_request' && github.head_ref == 'feature/fluent3d-optional-hq-pack-lite-apk' && contains(github.event.pull_request.title, '[ci-final]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        id: motion-cache
        with:
          path: java/assets/emoji3d-motion
          key: fluent3d-motion-lossless-webp256-gif256-v3-daa0365c09795789ed2bc6e8b228c97736cb6669-${{ hashFiles('scripts/build_emoji3d_motion.py') }}

      - name: Install pinned image converter on a cache miss
        if: steps.motion-cache.outputs.cache-hit != 'true'
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Fetch only original Microsoft motion via Git LFS
        if: steps.motion-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git lfs version
          MOTION_SHA=daa0365c09795789ed2bc6e8b228c97736cb6669
          MOTION_DIR="$RUNNER_TEMP/fluentui-emoji-animated"
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --filter=blob:none \
            --no-checkout https://github.com/microsoft/fluentui-emoji-animated.git \
            "$MOTION_DIR"
          (
            cd "$MOTION_DIR"
            git -c protocol.version=2 fetch --depth 1 origin "$MOTION_SHA"
            GIT_LFS_SKIP_SMUDGE=1 git checkout --detach "$MOTION_SHA"
            echo "Downloading curated original APNGs..."
            timeout 1200 git lfs pull \
              --include="$(python "$GITHUB_WORKSPACE/scripts/build_emoji3d_motion.py" --list-source-paths)" \
              --exclude=""
          )
          echo "Original APNGs ready:"
          du -h -s "$MOTION_DIR/assets"

      - name: Render and verify 30 full-color animations in parallel
        if: steps.motion-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/build_emoji3d_motion.py \
            --source "$RUNNER_TEMP/fluentui-emoji-animated" \
            --dest java/assets/emoji3d-motion --jobs 3

      - name: Validate animation catalog before caching
        shell: bash
        run: |
          set -euo pipefail
          test -s java/assets/emoji3d-motion/LICENSE.txt
          test -s java/assets/emoji3d-motion/SOURCE.json
          test "$(wc -l < java/assets/emoji3d-motion/index.txt)" -eq 30
          while IFS= read -r key; do
            test -s "java/assets/emoji3d-motion/$key.webp"
            test -s "java/assets/emoji3d-motion/$key.gif"
          done < java/assets/emoji3d-motion/index.txt
          echo "Verified 30 animated RGBA WebP + GIF pairs"
          du -h -s java/assets/emoji3d-motion

  animated-preview:
    if: ${{ github.event_name != 'workflow_dispatch' && github.head_ref != 'feature/fluent3d-optional-hq-pack-lite-apk' }}
    name: Compile, sign and inspect complete Stable Release preview
    needs: [static-assets, motion-assets]
    concurrency:
      group: fluent-emoji-hq-apk-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: Restore validated static RGB/A catalog (no re-encoding)
        uses: actions/cache/restore@v4
        with:
          path: |
            java/assets/emoji3d
            java/assets/emoji3d-share
          key: fluent3d-static128-share256-lossless-v3-7a40f1a2d064d76e436813edc0f09b6c8cde5da8-${{ hashFiles('scripts/build_emoji3d_assets.py') }}
          fail-on-cache-miss: true

      - name: Restore validated motion catalog (no re-encoding)
        uses: actions/cache/restore@v4
        with:
          path: java/assets/emoji3d-motion
          key: fluent3d-motion-lossless-webp256-gif256-v3-daa0365c09795789ed2bc6e8b228c97736cb6669-${{ hashFiles('scripts/build_emoji3d_motion.py') }}
          fail-on-cache-miss: true

      - name: Validate restored assets before Android setup
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < java/assets/emoji3d-motion/index.txt)" -eq 30
          test "$(wc -l < java/assets/emoji3d/index.txt)" -ge 2500
          cmp java/assets/emoji3d/index.txt java/assets/emoji3d-share/index.txt
          test -s java/assets/emoji3d-motion/1f600.webp
          test -s java/assets/emoji3d-motion/1f600.gif
          test -s java/assets/emoji3d-share/1f600.webp

      - name: Fetch pinned Android project submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --depth 1 --jobs 4 -- \
            libs translations java/assets/layouts java/assets/themes java/res-large \
            voiceinput-shared/src/main/ml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1"

      # Pull request jobs normally restore only. Allow write-back so subsequent
      # commits in this PR reuse Gradle task outputs and the local build cache.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run JVM regressions and assemble full APK
        shell: bash
        env:
          VERSION_NAME: emoji3d-motion-preview
          VERSION_CODE: "900002"
          BRANCH_NAME: master
        run: |
          set -euo pipefail
          test -f java/shared.keystore
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --build-cache --warning-mode summary \
            testStableReleaseUnitTest assembleStableRelease

      - name: Verify all original Fluent files INSIDE signed APK
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          mkdir -p preview-dist
          apk="$(find build/outputs/apk/stable/release -maxdepth 1 \
            -type f -name '*.apk' | head -n 1)"
          test -n "$apk" && test -s "$apk"
          cp "$apk" preview-dist/futo-keyboard-fluent-3d-animated-preview.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            preview-dist/futo-keyboard-fluent-3d-animated-preview.apk \
            > preview-dist/signature-verification.txt
          unzip -t preview-dist/futo-keyboard-fluent-3d-animated-preview.apk \
            > preview-dist/zip-integrity.txt
          python - <<'PY'
          import io
          import json
          from pathlib import Path
          from zipfile import ZipFile
          from PIL import Image

          apk = Path("preview-dist/futo-keyboard-fluent-3d-animated-preview.apk")
          with ZipFile(apk) as archive:
              names = set(archive.namelist())
              def keys(folder):
                  return archive.read(f"assets/{folder}/index.txt").decode().splitlines()

              ui = keys("emoji3d")
              share = keys("emoji3d-share")
              motion = keys("emoji3d-motion")
              assert len(ui) >= 2500 and ui == share
              assert len(motion) == 30
              for key in ui:
                  assert f"assets/emoji3d/{key}.webp" in names
                  assert f"assets/emoji3d-share/{key}.webp" in names

              for key in motion:
                  for extension in ("webp", "gif"):
                      member = f"assets/emoji3d-motion/{key}.{extension}"
                      with Image.open(io.BytesIO(archive.read(member))) as im:
                          assert im.size == (256, 256), member
                          assert im.n_frames >= 2, member
                          assert im.format == extension.upper(), member

              with Image.open(io.BytesIO(
                  archive.read("assets/emoji3d-share/1f600.webp")
              )) as still:
                  assert still.size == (256, 256)
                  assert still.getchannel("A").getextrema()[0] < 255
              details = json.loads(
                  archive.read("assets/emoji3d-share/SOURCE.json")
              )
              assert "lossless" in details["format"].lower()
              for folder in ("emoji3d", "emoji3d-share", "emoji3d-motion"):
                  assert f"assets/{folder}/LICENSE.txt" in names

              print(f"APK verified: {len(ui)} static picker images, "
                    f"{len(share)} 256px lossless sharing masters, "
                    f"{len(motion)} genuine animated WebP/GIF pairs.")
          PY
          unzip -p preview-dist/futo-keyboard-fluent-3d-animated-preview.apk \
            assets/emoji3d-motion/LICENSE.txt > preview-dist/FLUENT_ANIMATED_MIT_LICENSE.txt
          unzip -p preview-dist/futo-keyboard-fluent-3d-animated-preview.apk \
            assets/emoji3d-share/LICENSE.txt > preview-dist/FLUENT_HQ_MIT_LICENSE.txt
          (cd preview-dist && sha256sum futo-keyboard-fluent-3d-animated-preview.apk) \
            > preview-dist/SHA256SUMS
          printf '%s\n' \
            "Source commit: $GITHUB_SHA" \
            "Static 3D picker and share assets: $(wc -l < java/assets/emoji3d/index.txt)" \
            "Genuine animated 3D assets: 30 lossless WebP + 30 GIF" \
            "Signing: DEVELOPMENT key (not a production update)" \
            "GitHub Actions run: $GITHUB_RUN_ID" \
            > preview-dist/BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: futo-keyboard-fluent-3d-motion-preview
          path: preview-dist/
          if-no-files-found: error
          retention-days: 30

  lite-preview:
    # This is a one-time explicit PR final integration CI gate.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.lite) || (github.event_name == 'pull_request' && github.head_ref == 'feature/fluent3d-optional-hq-pack-lite-apk' && contains(github.event.pull_request.title, '[ci-final]')) }}
    name: Build signed small APK + original quality offline media package
    needs: [static-assets, motion-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: Restore validated 128px picker and full 256px still art
        uses: actions/cache/restore@v4
        with:
          path: |
            java/assets/emoji3d
            java/assets/emoji3d-share
          key: fluent3d-static128-share256-lossless-v3-7a40f1a2d064d76e436813edc0f09b6c8cde5da8-${{ hashFiles('scripts/build_emoji3d_assets.py') }}
          fail-on-cache-miss: true

      - name: Restore verified lossless WebP and GIF animations
        uses: actions/cache/restore@v4
        with:
          path: java/assets/emoji3d-motion
          key: fluent3d-motion-lossless-webp256-gif256-v3-daa0365c09795789ed2bc6e8b228c97736cb6669-${{ hashFiles('scripts/build_emoji3d_motion.py') }}
          fail-on-cache-miss: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit-test full Fluent ZIP reproducibility without Android
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_fluent3d_full_pack.py -v

      - name: Build independently installable FULL fidelity Fluent asset pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lite-dist
          python -u scripts/build_fluent3d_hq_pack.py \
            --preview java/assets/emoji3d \
            --share java/assets/emoji3d-share \
            --motion java/assets/emoji3d-motion \
            --out lite-dist/fluent3d-full-offline-collection.zip

      - name: Remove ALL four Fluent catalogs before APK assembly
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < java/assets/emoji3d/index.txt)" -ge 2500
          test "$(wc -l < java/assets/emoji3d-share/index.txt)" -ge 2500
          test "$(wc -l < java/assets/emoji3d-motion/index.txt)" -eq 30
          test -s lite-dist/fluent3d-full-offline-collection.zip
          rm -rf java/assets/emoji3d java/assets/emoji3d-share java/assets/emoji3d-motion
          test ! -e java/assets/emoji3d
          test ! -e java/assets/emoji3d-share
          test ! -e java/assets/emoji3d-motion
          echo "Fluent assets all external; no static, GIF or motion catalog in APK"

      - name: Initialize pinned Android submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --depth 1 --jobs 4 -- \
            libs translations java/assets/layouts java/assets/themes java/res-large \
            voiceinput-shared/src/main/ml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run JVM tests and compile lightweight release
        shell: bash
        env:
          VERSION_NAME: emoji3d-mediahub-lite
          VERSION_CODE: "900003"
          BRANCH_NAME: master
        run: |
          set -euo pipefail
          test -f java/shared.keystore
          chmod +x gradlew
          ./gradlew --no-daemon --build-cache --stacktrace \
            --warning-mode summary testStableReleaseUnitTest assembleStableRelease

      - name: Build OPTIONAL signed no-network local AI runtime APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --build-cache --stacktrace --warning-mode summary \
            -p offline-ai-runtime :app:assembleRelease
          runtime="$(find offline-ai-runtime/app/build/outputs/apk/release \
            -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -s "$runtime"
          cp "$runtime" lite-dist/futo-local-ai-runtime.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            lite-dist/futo-local-ai-runtime.apk \
            > lite-dist/local-ai-runtime-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions \
            lite-dist/futo-local-ai-runtime.apk \
            > lite-dist/local-ai-runtime-permissions.txt
          if grep -q 'android.permission.INTERNET' \
            lite-dist/local-ai-runtime-permissions.txt; then
            echo "::error::Optional local AI APK must not request INTERNET"
            exit 1
          fi

      - name: Verify APK contains no Fluent files and external pack preserves all media
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          apk="$(find build/outputs/apk/stable/release -maxdepth 1 \
            -name '*.apk' -type f | head -n 1)"
          test -s "$apk"
          cp "$apk" lite-dist/futo-keyboard-media-hub-lite.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            lite-dist/futo-keyboard-media-hub-lite.apk \
            > lite-dist/apk-signature.txt
          unzip -t lite-dist/futo-keyboard-media-hub-lite.apk \
            > lite-dist/apk-zip-integrity.txt
          python - <<'PY'
          import hashlib
          import io
          import json
          from pathlib import Path
          from zipfile import ZipFile
          from PIL import Image

          apk_path = Path("lite-dist/futo-keyboard-media-hub-lite.apk")
          pack_path = Path("lite-dist/fluent3d-full-offline-collection.zip")
          with ZipFile(apk_path) as apk:
              prefixes = ("assets/emoji3d/", "assets/emoji3d-share/",
                          "assets/emoji3d-motion/")
              for name in apk.namelist():
                  assert not name.startswith(prefixes), "Media bundled in APK: " + name
              print("Core APK: zero Fluent 3D bitmap and animation files")

          with ZipFile(pack_path) as pack:
              manifest = json.loads(pack.read("fluent-hq.json"))
              assert manifest["format"] == "fluent3d-full-v2"
              assert manifest["version"] == 2
              picker = pack.read("emoji3d/index.txt").decode().splitlines()
              sharing = pack.read("emoji3d-share/index.txt").decode().splitlines()
              motion = pack.read("emoji3d-motion/index.txt").decode().splitlines()
              assert len(picker) >= 2500 and picker == sharing
              assert len(motion) == 30
              assert manifest["ui_count"] == len(picker)
              assert manifest["share_count"] == len(sharing)
              assert manifest["motion_count"] == len(motion)
              entries = manifest["members"]
              assert len(entries) == 2 * len(picker) + 2 * len(motion) + 9
              assert set(pack.namelist()) == set(entries) | {"fluent-hq.json"}
              for folder in ("emoji3d", "emoji3d-share", "emoji3d-motion"):
                  for meta in ("index.txt", "LICENSE.txt", "SOURCE.json"):
                      assert f"{folder}/{meta}" in entries
              for key in picker:
                  assert f"emoji3d/{key}.webp" in entries
                  assert f"emoji3d-share/{key}.webp" in entries
              for key in motion:
                  assert f"emoji3d-motion/{key}.webp" in entries
                  assert f"emoji3d-motion/{key}.gif" in entries
              for name, expected in entries.items():
                  digest = hashlib.sha256()
                  with pack.open(name) as stream:
                      for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                          digest.update(chunk)
                  assert digest.hexdigest() == expected, name
              with Image.open(io.BytesIO(
                  pack.read("emoji3d-share/1f600.webp"))) as still:
                  assert still.size == (256, 256)
                  assert still.getchannel("A").getextrema()[0] < 255
              with Image.open(io.BytesIO(
                  pack.read("emoji3d-motion/1f600.webp"))) as animation:
                  assert animation.size == (256, 256)
                  assert animation.n_frames > 1
              with Image.open(io.BytesIO(
                  pack.read("emoji3d-motion/1f600.gif"))) as gif:
                  assert gif.n_frames > 1
              print(f"Verified full external collection: {len(picker)} UI previews, "
                    f"{len(sharing)} lossless RGBA masters, "
                    f"{len(motion)} Animated WebP and GIF pairs; all SHA256 passed")
          PY
          keyboard_cert="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --print-certs lite-dist/futo-keyboard-media-hub-lite.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          runtime_cert="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --print-certs lite-dist/futo-local-ai-runtime.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$keyboard_cert"
          test "$keyboard_cert" = "$runtime_cert"
          echo "The keyboard and optional AI companion use the same signing cert"
          (cd lite-dist && sha256sum \
            futo-keyboard-media-hub-lite.apk \
            futo-local-ai-runtime.apk \
            fluent3d-full-offline-collection.zip) > lite-dist/SHA256SUMS
          printf '%s\n' \
            "Source commit: $GITHUB_SHA" \
            "Keyboard: zero bundled Fluent 3D catalogs; Unicode fallback available" \
            "Optional offline inference: separate signed APK and manually imported model" \
            "Optional AI companion network permission: none" \
            "Original 128px, 256px RGBA, animated WebP and GIF: optional offline ZIP" \
            "Signing: DEVELOPMENT/test key; not an upgrade to production builds" \
            "Run: $GITHUB_RUN_ID" \
            > lite-dist/BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: futo-media-hub-core-apk-plus-fluent-full-pack
          path: lite-dist/
          if-no-files-found: error
          retention-days: 30
