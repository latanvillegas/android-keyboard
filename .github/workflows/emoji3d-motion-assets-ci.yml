name: Verify lossless Fluent RGBA animated assets

on:
  pull_request:
    paths:
      - "scripts/build_emoji3d_motion.py"
      - ".github/workflows/emoji3d-motion-assets-ci.yml"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fluent-animation:
    name: Verify source animation frames, lossless WebP and GIF fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned animation converter
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Fetch only the selected MIT-licensed original Microsoft animations
        shell: bash
        run: |
          set -euo pipefail
          git lfs version
          MOTION_SHA=daa0365c09795789ed2bc6e8b228c97736cb6669
          MOTION_DIR="$RUNNER_TEMP/fluentui-emoji-animated"
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/microsoft/fluentui-emoji-animated.git "$MOTION_DIR"
          (
            cd "$MOTION_DIR"
            git -c protocol.version=2 fetch --depth 1 origin "$MOTION_SHA"
            GIT_LFS_SKIP_SMUDGE=1 git checkout --detach "$MOTION_SHA"
            git lfs pull --include="$(python "$GITHUB_WORKSPACE/scripts/build_emoji3d_motion.py" --list-source-paths)" --exclude=""
          )
          python scripts/build_emoji3d_motion.py \
            --source "$MOTION_DIR" \
            --dest "$RUNNER_TEMP/emoji3d-motion"

      - name: Verify actual RGBA animation, resolution and compatible GIF
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/emoji3d-motion/LICENSE.txt"
          test -s "$RUNNER_TEMP/emoji3d-motion/SOURCE.json"
          test "$(wc -l < "$RUNNER_TEMP/emoji3d-motion/index.txt")" -eq 30
          python - <<'PY'
          import json, os
          from pathlib import Path
          from PIL import Image
          root = Path(os.environ["RUNNER_TEMP"]) / "emoji3d-motion"
          manifest = json.loads((root / "SOURCE.json").read_text())
          assert manifest["count"] == 30
          assert len(manifest["assets"]) == 30
          webp_total = gif_total = 0
          for key, info in manifest["assets"].items():
              assert info["size"] == 256, key
              for extension in ("webp", "gif"):
                  path = root / (key + "." + extension)
                  with Image.open(path) as image:
                      assert image.format == extension.upper(), path
                      assert image.size == (256, 256), path
                      assert image.n_frames >= 2, path
                      image.seek(0)
                      assert image.convert("RGBA").getchannel("A").getextrema()[0] < 255, path
                  if extension == "webp":
                      assert info["webp_frames"] >= info["gif_frames"]
                      webp_total += path.stat().st_size
                  else:
                      gif_total += path.stat().st_size
          print(f"Validated 30 true animated RGBA 256px WebP files "
                f"({webp_total / 1048576:.1f} MiB) and 30 GIF fallbacks "
                f"({gif_total / 1048576:.1f} MiB)")
          PY
