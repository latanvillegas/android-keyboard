name: Build FUTO Stable Release APK

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/android-release.yml"
      - "java/**"
      - "common/**"
      - "scripts/**"
      - "tests/unit/**"
      - "native/**"
      - "voiceinput-shared/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".gitmodules"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: futo-stable-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable-release:
    name: Compile, sign and verify Stable Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: Fetch pinned upstream submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --depth 1 --jobs 4 -- \
            libs \
            translations \
            java/assets/layouts \
            java/assets/themes \
            java/res-large \
            voiceinput-shared/src/main/ml

      - name: Audit Spanish localization and formatting placeholders
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_spanish_resources.py \
            --root . --out spanish-audit --strict-ui

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      # Real prerendered 3D artwork, not UI-generated shadows/cards. Pinned
      # to an immutable upstream commit; only the Release APK packages it.
      - uses: actions/cache@v4
        id: fluent3d-cache
        with:
          path: |
            java/assets/emoji3d
            java/assets/emoji3d-share
          key: fluent3d-static128-share256-lossless-v3-7a40f1a2d064d76e436813edc0f09b6c8cde5da8-${{ hashFiles('scripts/build_emoji3d_assets.py') }}

      - uses: actions/setup-python@v5
        if: steps.fluent3d-cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.11'

      - name: Download and package licensed Fluent Emoji 3D
        if: steps.fluent3d-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          FLUENT_COMMIT=7a40f1a2d064d76e436813edc0f09b6c8cde5da8
          FLUENT_DIR="$RUNNER_TEMP/fluentui-emoji-unicode"
          mkdir -p "$FLUENT_DIR"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 900 \
            "https://codeload.github.com/shuding/fluentui-emoji-unicode/tar.gz/$FLUENT_COMMIT" \
            -o "$RUNNER_TEMP/fluentui-emoji-3d.tar.gz"
          tar xzf "$RUNNER_TEMP/fluentui-emoji-3d.tar.gz" \
            -C "$FLUENT_DIR" --strip-components=1
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python -u scripts/build_emoji3d_assets.py \
            --source "$FLUENT_DIR/assets" \
            --dest java/assets/emoji3d \
            --share-dest java/assets/emoji3d-share \
            --commit "$FLUENT_COMMIT" --jobs 4
          rm -f "$RUNNER_TEMP/fluentui-emoji-3d.tar.gz"
          rm -rf "$FLUENT_DIR"

      - name: Verify packaged 3D assets and MIT license
        shell: bash
        run: |
          set -euo pipefail
          test -s java/assets/emoji3d/LICENSE.txt
          test -s java/assets/emoji3d/SOURCE.json
          count="$(wc -l < java/assets/emoji3d/index.txt)"
          if (( count < 2500 )); then
            echo "::error::Only $count 3D assets staged, expected at least 2500."
            exit 1
          fi
          test -s java/assets/emoji3d/1f600.webp
          test -s java/assets/emoji3d/1f44d-1f3fb.webp
          test -s java/assets/emoji3d-share/LICENSE.txt
          test -s java/assets/emoji3d-share/SOURCE.json
          share_count="$(wc -l < java/assets/emoji3d-share/index.txt)"
          test "$share_count" -eq "$count"
          test -s java/assets/emoji3d-share/1f600.webp
          test -s java/assets/emoji3d-share/1f44d-1f3fb.webp
          du -h -s java/assets/emoji3d java/assets/emoji3d-share
          echo "3D Fluent UI and lossless 256px share assets staged: $count"

      # Persist verified images before removing them from the APK build tree.
      - uses: actions/cache/save@v4
        if: steps.fluent3d-cache.outputs.cache-hit != 'true'
        with:
          path: |
            java/assets/emoji3d
            java/assets/emoji3d-share
          key: fluent3d-static128-share256-lossless-v3-7a40f1a2d064d76e436813edc0f09b6c8cde5da8-${{ hashFiles('scripts/build_emoji3d_assets.py') }}

      - uses: actions/cache@v4
        id: fluent-motion-cache
        with:
          path: java/assets/emoji3d-motion
          key: fluent3d-motion-lossless-webp256-gif256-v3-daa0365c09795789ed2bc6e8b228c97736cb6669-${{ hashFiles('scripts/build_emoji3d_motion.py') }}

      - uses: actions/setup-python@v5
        if: steps.fluent-motion-cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.11'

      - name: Package genuine animated Fluent 3D frames
        if: steps.fluent-motion-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          git lfs version
          MOTION_SHA=daa0365c09795789ed2bc6e8b228c97736cb6669
          MOTION_DIR="$RUNNER_TEMP/fluentui-emoji-animated"
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/microsoft/fluentui-emoji-animated.git "$MOTION_DIR"
          (
            cd "$MOTION_DIR"
            git -c protocol.version=2 fetch --depth 1 origin "$MOTION_SHA"
            GIT_LFS_SKIP_SMUDGE=1 git checkout --detach "$MOTION_SHA"
            git lfs pull --include="$(python "$GITHUB_WORKSPACE/scripts/build_emoji3d_motion.py" --list-source-paths)" --exclude=""
          )
          python -u scripts/build_emoji3d_motion.py \
            --source "$MOTION_DIR" --dest java/assets/emoji3d-motion --jobs 3
          rm -rf "$MOTION_DIR"

      - name: Verify genuine 256px RGBA WebP and GIF assets and MIT license
        shell: bash
        run: |
          set -euo pipefail
          test -s java/assets/emoji3d-motion/LICENSE.txt
          test -s java/assets/emoji3d-motion/SOURCE.json
          test "$(wc -l < java/assets/emoji3d-motion/index.txt)" -eq 30
          test -s java/assets/emoji3d-motion/1f600.webp
          test -s java/assets/emoji3d-motion/1f600.gif
          test -s java/assets/emoji3d-motion/1f602.webp
          test -s java/assets/emoji3d-motion/1f602.gif
          test -s java/assets/emoji3d-motion/1f62d.webp
          test -s java/assets/emoji3d-motion/1f62d.gif
          du -h -s java/assets/emoji3d-motion

      - uses: actions/cache/save@v4
        if: steps.fluent-motion-cache.outputs.cache-hit != 'true'
        with:
          path: java/assets/emoji3d-motion
          key: fluent3d-motion-lossless-webp256-gif256-v3-daa0365c09795789ed2bc6e8b228c97736cb6669-${{ hashFiles('scripts/build_emoji3d_motion.py') }}

      - name: Export all Fluent 3D imagery into separately installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-dist
          python3 -u scripts/build_fluent3d_hq_pack.py \
            --preview java/assets/emoji3d \
            --share java/assets/emoji3d-share \
            --motion java/assets/emoji3d-motion \
            --out release-dist/fluent3d-full-offline-collection.zip
          rm -rf java/assets/emoji3d java/assets/emoji3d-share java/assets/emoji3d-motion
          for folder in emoji3d emoji3d-share emoji3d-motion; do
            test ! -e "java/assets/$folder"
          done

      - name: Configure production signing if secrets exist
        id: signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_KEYSTORE_BASE64" ]]; then
            if [[ -z "$RELEASE_KEY_ALIAS" || -z "$RELEASE_KEY_PASSWORD" || -z "$RELEASE_STORE_PASSWORD" ]]; then
              echo "::error::All four release signing secrets must be configured."
              exit 1
            fi
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-signing.jks"
            chmod 600 "$RUNNER_TEMP/release-signing.jks"
            python3 - <<'PY'
          import os
          from pathlib import Path
          def escape_prop(v):
              result = v.replace(chr(92), chr(92) + chr(92))
              result = result.replace(chr(10), chr(92) + 'n')
              result = result.replace(chr(13), chr(92) + 'r')
              result = result.replace('=', chr(92) + '=')
              result = result.replace(':', chr(92) + ':')
              result = result.replace(' ', chr(92) + ' ')
              return result
          values = {
              'storeFile': str(Path(os.environ['RUNNER_TEMP']) / 'release-signing.jks'),
              'storePassword': os.environ['RELEASE_STORE_PASSWORD'],
              'keyPassword': os.environ['RELEASE_KEY_PASSWORD'],
              'keyAlias': os.environ['RELEASE_KEY_ALIAS'],
          }
          Path('keystore.properties').write_text(
              ''.join(k + '=' + escape_prop(v) + chr(10) for k, v in values.items()),
              encoding='utf-8'
          )
          PY
            echo "kind=production-signed" >> "$GITHUB_OUTPUT"
            echo "SIGNING_KIND=production-signed" >> "$GITHUB_ENV"
          else
            if [[ -n "$RELEASE_KEY_ALIAS" || -n "$RELEASE_KEY_PASSWORD" || -n "$RELEASE_STORE_PASSWORD" ]]; then
              echo "::error::Signing secrets are incomplete."
              exit 1
            fi
            test -f java/shared.keystore
            echo "::warning::Stable Release uses DEVELOPMENT signing; do not publish as a production update."
            echo "kind=test-signed" >> "$GITHUB_OUTPUT"
            echo "SIGNING_KIND=test-signed" >> "$GITHUB_ENV"
          fi

      - name: Assemble optimized Stable Release APK
        shell: bash
        env:
          VERSION_NAME: fork-stable-${{ github.run_number }}
          VERSION_CODE: ${{ github.run_number }}
          BRANCH_NAME: master
        run: |
          set -euo pipefail
          chmod +x gradlew
          # JVM regression tests compile no Debug APK or instrumentation package.
          ./gradlew --no-daemon --stacktrace --build-cache --warning-mode summary \
            testStableReleaseUnitTest assembleStableRelease

      - name: Verify APK signature, contents and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build/outputs/apk/stable/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [[ -z "$apk" || ! -s "$apk" ]]; then
            echo "::error::No Stable Release APK was produced."
            exit 1
          fi
          mkdir -p release-dist
          cp "$apk" release-dist/futo-keyboard-stable-release.apk
          cp spanish-audit/report.json release-dist/spanish-audit.json
          cp spanish-audit/report.md release-dist/spanish-audit.md
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            release-dist/futo-keyboard-stable-release.apk | tee release-dist/apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            release-dist/futo-keyboard-stable-release.apk | head -n 20 \
            | tee release-dist/apk-manifest.txt
          unzip -t release-dist/futo-keyboard-stable-release.apk \
            | tail -n 1 | tee release-dist/zip-integrity.txt
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path("release-dist/futo-keyboard-stable-release.apk")
          pack = Path("release-dist/fluent3d-full-offline-collection.zip")
          forbidden = ("assets/emoji3d/", "assets/emoji3d-share/",
                       "assets/emoji3d-motion/")
          with ZipFile(apk) as source:
              for name in source.namelist():
                  assert not name.startswith(forbidden), name
          with ZipFile(pack) as archive:
              metadata = json.loads(archive.read("fluent-hq.json"))
              assert metadata["format"] == "fluent3d-full-v2"
              assert metadata["ui_count"] >= 2500
              assert metadata["share_count"] == metadata["ui_count"]
              assert metadata["motion_count"] == 30
              checksums = metadata["members"]
              assert len(checksums) == 2 * metadata["ui_count"] + 2 * 30 + 9
              for name, expected in checksums.items():
                  digest = hashlib.sha256()
                  with archive.open(name) as stream:
                      for chunk in iter(lambda: stream.read(1048576), b""):
                          digest.update(chunk)
                  assert digest.hexdigest() == expected, name
          print("Release APK contains zero Fluent media. All four external "
                "catalogs passed SHA-256 verification.")
          PY
          (cd release-dist && sha256sum \
            futo-keyboard-stable-release.apk \
            fluent3d-full-offline-collection.zip) > release-dist/SHA256SUMS
          printf '%s\n' \
            "commit=$GITHUB_SHA" \
            "workflow_run=$GITHUB_RUN_ID" \
            "variant=stableRelease-no-bundled-Fluent-assets" \
            "signing=$SIGNING_KIND" \
            "fluent_3d=external_installable_full_quality_pack" \
            "fluent_3d_catalogs=2980_ui+2980_rgba256+30_animated_webp+30_gif" \
            > release-dist/BUILD-INFO.txt

      - name: Publish Stable Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: futo-keyboard-stable-release-${{ steps.signing.outputs.kind }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing materials
        if: always()
        shell: bash
        run: |
          rm -f keystore.properties "$RUNNER_TEMP/release-signing.jks"
