name: Feature verified vfork-stable-56 on repository Releases

# Publish the immutable, verified build once; subsequent release-note updates
# edit only the existing release metadata and preserve the APK attachments.
on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/publish-vfork-stable-56.yml
      - docs/releases/vfork-stable-56.md
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Verify artifact and create/update experimental GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: vfork-stable-56
      SOURCE_RUN_ID: "41537785104"
      SOURCE_SHA: ea8acd0125205245b88d219ef6331a700f2857f4
    steps:
      - name: Check out complete release notes
        uses: actions/checkout@v4

      - name: Fetch the successful Stable Release build artifact
        uses: actions/download-artifact@v4
        with:
          name: futo-keyboard-stable-release-test-signed
          repository: ${{ github.repository }}
          run-id: 41537785104
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-dist

      - name: Verify provenance and archive integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s release-dist/futo-keyboard-stable-release.apk
          test -s release-dist/BUILD-INFO.txt
          test -s release-dist/apk-signature.txt
          test -s release-dist/apk-manifest.txt
          test -s release-dist/SHA256SUMS
          test -s release-dist/spanish-audit.json
          test -s release-dist/spanish-audit.md
          test -s release-dist/emoji-3d-verification.txt
          test -s release-dist/FLUENT_EMOJI_LICENSE.txt
          test -s docs/releases/vfork-stable-56.md
          grep -Fx "commit=$SOURCE_SHA" release-dist/BUILD-INFO.txt
          grep -Fx "workflow_run=$SOURCE_RUN_ID" release-dist/BUILD-INFO.txt
          grep -Fx "variant=stableRelease" release-dist/BUILD-INFO.txt
          grep -Fx "signing=test-signed" release-dist/BUILD-INFO.txt
          (cd release-dist && sha256sum --check SHA256SUMS)
          unzip -t release-dist/futo-keyboard-stable-release.apk | tail -n 1

      - name: Prepare clearly labeled prerelease files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-ready
          cp release-dist/futo-keyboard-stable-release.apk \
            release-ready/futo-keyboard-vfork-stable-56-test-signed.apk
          cp release-dist/BUILD-INFO.txt release-ready/
          cp release-dist/apk-signature.txt release-ready/
          cp release-dist/apk-manifest.txt release-ready/
          cp release-dist/spanish-audit.json release-ready/
          cp release-dist/spanish-audit.md release-ready/
          cp release-dist/emoji-3d-verification.txt release-ready/
          cp release-dist/FLUENT_EMOJI_LICENSE.txt release-ready/
          (cd release-ready && sha256sum futo-keyboard-vfork-stable-56-test-signed.apk > SHA256SUMS)
          cat release-ready/SHA256SUMS

      - name: Feature experimental Release with full changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Updating release description only; APK and hashes stay untouched."
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "FUTO Keyboard Fork vfork-stable-56 — Fluent Emoji 3D + Temas V2.2 (TEST-SIGNED)" \
              --notes-file docs/releases/vfork-stable-56.md \
              --prerelease=false \
              --latest
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,isPrerelease,tagName
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            release-ready/futo-keyboard-vfork-stable-56-test-signed.apk \
            release-ready/SHA256SUMS \
            release-ready/BUILD-INFO.txt \
            release-ready/apk-signature.txt \
            release-ready/apk-manifest.txt \
            release-ready/spanish-audit.json \
            release-ready/spanish-audit.md \
            release-ready/emoji-3d-verification.txt \
            release-ready/FLUENT_EMOJI_LICENSE.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "FUTO Keyboard Fork vfork-stable-56 — Fluent Emoji 3D + Temas V2.2 (TEST-SIGNED)" \
            --notes-file docs/releases/vfork-stable-56.md \
            --latest
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,isPrerelease,tagName

      - name: Attach SHA-256 verified Aurora V9 and Obsidian V2 ZIP themes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p theme-assets
          base="https://raw.githubusercontent.com/latanvillegas/futo-keyboard-themes/6a1455c763d3ea90b34c604596f1d69501b7b112/dist"
          aurora="Aurora_3D_V9_Colores_Teclado.zip"
          obsidian="Obsidian3DTactile_FUTO_Original_Actualizado.zip"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            "$base/$aurora" -o "theme-assets/$aurora"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            "$base/$obsidian" -o "theme-assets/$obsidian"
          printf '%s  %s\n' \
            "9e7364082ae4c0301812981b66d102b5f2e27967b0081fad64409eafdbc2e281" "$aurora" \
            > theme-assets/THEMES_SHA256SUMS
          printf '%s  %s\n' \
            "2ddd6f33f8dbc8aa65ff7da894d738d8f75f246f83cd44a48c68275fb260c91f" "$obsidian" \
            >> theme-assets/THEMES_SHA256SUMS
          (cd theme-assets && sha256sum --check THEMES_SHA256SUMS)
          for file in "$aurora" "$obsidian"; do
            unzip -t "theme-assets/$file" | tail -n 1
            unzip -Z1 "theme-assets/$file" | grep -qx 'theme.txt'
          done
          gh release upload "$RELEASE_TAG" \
            "theme-assets/$aurora" \
            "theme-assets/$obsidian" \
            "theme-assets/THEMES_SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            | jq --arg a "$aurora" --arg b "$obsidian" -e '
                [.assets[].name] as $names |
                (($names | index($a)) != null) and
                (($names | index($b)) != null) and
                (($names | index("THEMES_SHA256SUMS")) != null) and
                (($names | index("futo-keyboard-vfork-stable-56-test-signed.apk")) != null)
              '
